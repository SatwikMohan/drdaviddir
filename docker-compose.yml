services:
  app:
    build: .
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the process environment}
      PANMAN_DATA_ROOT: /data
    volumes:
      - ./backend/config.py:/app/backend/config.py:ro
      - ./backend/raw_data_files:/data/raw_data_files:ro
      - ./backend/vector_db:/data/vector_db
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
